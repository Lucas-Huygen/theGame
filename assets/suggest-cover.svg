<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="KaaiSpots — Suggesteer een spot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAF7"/>
      <stop offset="1" stop-color="#FFE9DD"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E8E7E1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F0F0F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)" opacity="0.6"/>

  <!-- Map "route" line -->
  <path d="M -20 380 Q 200 320 380 360 T 760 300 T 1180 340 T 1540 280"
        stroke="#0F0F0F" stroke-width="3" fill="none" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.35"/>

  <!-- Decorative pin (left) -->
  <g transform="translate(180 360)" filter="url(#shadow)">
    <path d="M0 -70 C 32 -70 52 -50 52 -22 C 52 8 22 36 0 70 C -22 36 -52 8 -52 -22 C -52 -50 -32 -70 0 -70 Z"
          fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/>
    <circle cx="0" cy="-22" r="14" fill="#FF6B35"/>
  </g>

  <!-- Decorative pin (right, smaller) -->
  <g transform="translate(1320 200)" filter="url(#shadow)">
    <path d="M0 -50 C 22 -50 38 -35 38 -15 C 38 6 18 26 0 50 C -18 26 -38 6 -38 -15 C -38 -35 -22 -50 0 -50 Z"
          fill="#FF6B35" stroke="#0F0F0F" stroke-width="3"/>
    <circle cx="0" cy="-15" r="9" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark / eyebrow -->
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2B2B2B">
    <text x="320" y="150" font-size="22" letter-spacing="6">KAAISPOTS · CAMPUS KAAI · EHB</text>
  </g>

  <!-- Headline -->
  <g font-family="'Space Grotesk', system-ui, -apple-system, Segoe UI, sans-serif" fill="#0F0F0F">
    <text x="320" y="240" font-size="84" font-weight="700">Tip een spot.</text>
    <text x="320" y="320" font-size="84" font-weight="700">
      Chill, eet of <tspan fill="#FF6B35">vibe.</tspan>
    </text>
  </g>

  <!-- Subline -->
  <g font-family="'Space Grotesk', system-ui, sans-serif" fill="#2B2B2B">
    <text x="320" y="380" font-size="24" font-weight="500">
      De beste pauzeplekken rond school — gespot door studenten, voor studenten.
    </text>
  </g>

  <!-- Tag chips -->
  <g font-family="'JetBrains Mono', monospace" font-size="16" font-weight="500">
    <g transform="translate(320 420)">
      <rect width="92" height="34" rx="17" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="2"/>
      <text x="46" y="22" text-anchor="middle" fill="#0F0F0F">chill</text>
    </g>
    <g transform="translate(424 420)">
      <rect width="92" height="34" rx="17" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="2"/>
      <text x="46" y="22" text-anchor="middle" fill="#0F0F0F">eten</text>
    </g>
    <g transform="translate(528 420)">
      <rect width="120" height="34" rx="17" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="2"/>
      <text x="60" y="22" text-anchor="middle" fill="#0F0F0F">studeren</text>
    </g>
    <g transform="translate(660 420)">
      <rect width="92" height="34" rx="17" fill="#FF6B35" stroke="#0F0F0F" stroke-width="2"/>
      <text x="46" y="22" text-anchor="middle" fill="#FFFFFF">vibe</text>
    </g>
  </g>
</svg>
