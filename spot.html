<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spot — KaaiSpots</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #FAFAF7;
    --bg-elev: #FFFFFF;
    --ink: #0F0F0F;
    --ink-2: #2B2B2B;
    --muted: #6B6B66;
    --line: #E8E7E1;
    --line-2: #D9D7CF;
    --accent: #FF6B35;
    --accent-soft: #FFE9DD;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(15,15,15,.06);
    --radius: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;
    --header-h: 56px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Space Grotesk", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    font-size: 15px; line-height: 1.5;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }

  /* ---------- header ---------- */
  .header {
    position: sticky; top: 0; z-index: 50;
    height: var(--header-h);
    background: rgba(250,250,247,.85);
    backdrop-filter: saturate(140%) blur(10px);
    -webkit-backdrop-filter: saturate(140%) blur(10px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 17px; letter-spacing: -0.01em;
    text-decoration: none;
  }
  .brand-pin { width: 18px; height: 18px; color: var(--accent); display: inline-grid; place-items: center; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); text-decoration: none;
    font-weight: 500;
    padding: 6px 10px; border-radius: 6px;
  }
  .back-link:hover { color: var(--ink); background: var(--line); }

  /* ---------- hero block ---------- */
  .hero {
    height: 280px;
    color: #fff;
    display: flex; align-items: flex-end;
    padding: 22px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 10px, transparent 10px 20px);
  }
  .hero-inner { position: relative; z-index: 1; max-width: 920px; width: 100%; }
  .hero .crumb {
    font-size: 12px; opacity: .85;
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 10px;
  }
  .hero h1 {
    font-size: clamp(28px, 4.6vw, 48px);
    font-weight: 700; letter-spacing: -0.02em; line-height: 1;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .hero .meta-row {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .hero .badge {
    font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.3);
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    color: #fff;
    backdrop-filter: blur(4px);
  }
  .hero .badge.fav { background: var(--accent); border-color: var(--accent); }

  /* ---------- main grid ---------- */
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 22px 60px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 36px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; gap: 24px; padding: 22px 16px 48px; }
    .hero { height: 220px; }
  }

  /* ---------- content sections ---------- */
  section + section { margin-top: 32px; }
  h2.section-title {
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted);
    margin: 0 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .lede {
    font-size: 18px; line-height: 1.55;
    color: var(--ink-2);
    text-wrap: pretty;
    margin: 0;
    max-width: 65ch;
  }

  /* "why" pills */
  .why-list {
    list-style: none; padding: 0; margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px;
  }
  .why-list li {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 12px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 14px; line-height: 1.4;
  }
  .why-list li::before {
    content: "→";
    color: var(--accent); font-weight: 700;
    flex-shrink: 0; line-height: 1.4;
  }

  /* menu / aanbod */
  .menu-section + .menu-section { margin-top: 18px; }
  .menu-section h3 {
    font-size: 16px; font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.005em;
  }
  .menu-table {
    border-top: 1px solid var(--line);
  }
  .menu-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px dashed var(--line);
    align-items: baseline;
  }
  .menu-name {
    font-weight: 500;
    font-size: 15px;
  }
  .menu-desc {
    font-size: 13px; color: var(--muted);
    margin-top: 2px;
  }
  .menu-price {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px; font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    text-align: right;
  }
  .menu-price.free { color: var(--accent); }

  /* facilities */
  .facilities {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }
  .facility {
    padding: 12px 14px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .facility .fname { font-weight: 600; font-size: 14px; }
  .facility .fdesc { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* tip block */
  .tip {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .tip-glyph {
    background: var(--accent); color: #fff;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700;
    flex-shrink: 0;
    font-size: 14px;
  }
  .tip-body { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
  .tip-body strong { color: var(--ink); }

  /* ---------- sidebar ---------- */
  .side {
    position: sticky; top: calc(var(--header-h) + 18px);
    display: flex; flex-direction: column; gap: 16px;
  }
  @media (max-width: 820px) {
    .side { position: static; }
  }
  .info-card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px;
  }
  .info-card h3 {
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .kv {
    display: grid; grid-template-columns: 90px 1fr;
    gap: 4px 14px;
    font-size: 14px;
  }
  .kv dt { color: var(--muted); font-size: 13px; }
  .kv dd { margin: 0; color: var(--ink-2); }
  .kv dd a { text-decoration: none; border-bottom: 1px solid var(--line-2); }
  .kv dd a:hover { border-color: var(--ink); }

  .hours {
    display: grid; grid-template-columns: 1fr auto;
    gap: 4px 12px;
    font-size: 13px;
    margin: 0;
  }
  .hours dt { color: var(--ink-2); }
  .hours dd { margin: 0; color: var(--muted); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
  .hours .today { color: var(--accent); font-weight: 600; }
  .hours .today + dd { color: var(--accent); font-weight: 600; }

  .open-now-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    color: #1F6B2E;
    background: #E8F6E8;
    border-radius: var(--radius-pill);
    padding: 4px 10px;
    margin-bottom: 12px;
  }
  .open-now-pill .led {
    width: 7px; height: 7px; background: #1F6B2E; border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(31,107,46,.18);
  }

  .cta {
    display: block;
    background: var(--ink); color: #fff;
    border: 0; text-decoration: none; text-align: center;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px; font-weight: 600;
    transition: background .12s ease;
  }
  .cta:hover { background: var(--accent); }
  .cta.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line-2);
  }
  .cta.secondary:hover { border-color: var(--ink); background: var(--bg); }

  /* tags reused */
  .tag {
    font-size: 12px; font-weight: 500;
    padding: 3px 10px; border-radius: var(--radius-pill);
    background: var(--line); color: var(--ink-2);
    line-height: 1.4;
    display: inline-block;
  }
  .tag.cat-eten     { background: #FFEFE6; color: #B5430A; }
  .tag.cat-drinken  { background: #F1ECFF; color: #4A2FAB; }
  .tag.cat-studeren { background: #E6F2FF; color: #134B8A; }
  .tag.cat-chillen  { background: #E8F6E8; color: #1F6B2E; }
  .tag.cat-cultuur  { background: #FFF1F2; color: #9B1B3F; }
  .tag.cat-gratis   { background: var(--ink); color: #fff; }
  .tag.price        { background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); }

  .perk-block {
    background: var(--ink); color: #fff;
    padding: 14px 16px;
    border-radius: var(--radius-lg);
  }
  .perk-block .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--accent); font-weight: 600;
    margin-bottom: 4px;
  }
  .perk-block .body { font-size: 14px; line-height: 1.4; }

  /* not found */
  .notfound {
    max-width: 520px; margin: 80px auto; text-align: center; padding: 22px;
  }
  .notfound h1 { font-size: 28px; margin: 0 0 8px; }
  .notfound p { color: var(--muted); }
</style>
</head>
<body>

<header class="header">
  <a class="brand" href="KaaiSpots.html">
    <span class="brand-pin" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2C7.6 2 4 5.5 4 9.8c0 5.6 7.2 11.6 7.5 11.9.3.2.7.2 1 0C12.8 21.4 20 15.4 20 9.8 20 5.5 16.4 2 12 2z" fill="currentColor"/>
        <circle cx="12" cy="9.5" r="2.6" fill="#fff"/>
      </svg>
    </span>
    KaaiSpots
  </a>
  <a class="back-link" href="KaaiSpots.html">← terug naar de kaart</a>
</header>

<div id="root">
  <!-- gerendered door JS -->
</div>

<script src="spots.js"></script>
<script>
(function() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const spot = (window.SPOTS || []).find(s => s.id === id);
  const root = document.getElementById('root');

  if (!spot) {
    root.innerHTML = `
      <div class="notfound">
        <h1>Spot niet gevonden</h1>
        <p>Geen spot met id "<span class="mono">${id || ''}</span>". Misschien is hij verwijderd, of de link klopt niet.</p>
        <p><a class="cta" href="KaaiSpots.html" style="display:inline-block;margin-top:12px">← Terug naar de kaart</a></p>
      </div>`;
    return;
  }

  document.title = `${spot.name} — KaaiSpots`;

  /* ----- helpers ----- */
  const CAT_CLASS = window.CAT_CLASS;

  const tags = spot.cats.map(c => `<span class="tag ${CAT_CLASS[c]}">${c}</span>`).join('');
  const priceTag = spot.price === 0
    ? `<span class="tag cat-gratis">Gratis</span>`
    : `<span class="tag price">${'€'.repeat(spot.price)}</span>`;
  const favBadge = spot.favorite ? `<span class="badge fav">★ Favoriet van het team</span>` : '';

  // Today's day in Dutch
  const days = ['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'];
  const todayName = days[new Date().getDay()];

  let hoursHtml = '';
  if (spot.hours) {
    hoursHtml = '<dl class="hours">' + Object.entries(spot.hours).map(([k, v]) => {
      const isToday = k === todayName;
      return `<dt class="${isToday ? 'today' : ''}">${k}</dt><dd>${v || ''}</dd>`;
    }).join('') + '</dl>';
  }

  let menuHtml = '';
  if (spot.menu && spot.menu.length) {
    menuHtml = `
      <section>
        <h2 class="section-title">${spot.cats.includes('Cultuur') && !spot.cats.includes('Eten') && !spot.cats.includes('Drinken') ? 'Wat er te zien is' : 'Wat ze verkopen'}</h2>
        ${spot.menu.map(s => `
          <div class="menu-section">
            <h3>${s.section}</h3>
            <div class="menu-table">
              ${s.items.map(item => `
                <div class="menu-row">
                  <div>
                    <div class="menu-name">${item.name}</div>
                    ${item.desc ? `<div class="menu-desc">${item.desc}</div>` : ''}
                  </div>
                  <div class="menu-price ${/gratis/i.test(item.price) ? 'free' : ''}">${/^[0-9]/.test(item.price) ? '€ ' + item.price : item.price}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </section>`;
  }

  let facilitiesHtml = '';
  if (spot.facilities && spot.facilities.length) {
    facilitiesHtml = `
      <section>
        <h2 class="section-title">Faciliteiten</h2>
        <div class="facilities">
          ${spot.facilities.map(f => `
            <div class="facility">
              <div class="fname">${f.name}</div>
              <div class="fdesc">${f.desc}</div>
            </div>`).join('')}
        </div>
      </section>`;
  }

  let whyHtml = '';
  if (spot.why && spot.why.length) {
    whyHtml = `
      <section>
        <h2 class="section-title">Waarom hier</h2>
        <ul class="why-list">${spot.why.map(w => `<li>${w}</li>`).join('')}</ul>
      </section>`;
  }

  let tipHtml = '';
  if (spot.tips) {
    tipHtml = `
      <section>
        <div class="tip">
          <div class="tip-glyph">i</div>
          <div class="tip-body"><strong>Insider tip.</strong> ${spot.tips}</div>
        </div>
      </section>`;
  }

  // Sidebar
  const dest = `${spot.coords[0]},${spot.coords[1]}`;
  const routeUrl = `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking`;

  let perkHtml = '';
  if (spot.student_perk) {
    perkHtml = `
      <div class="perk-block">
        <div class="label">Studentenvoordeel</div>
        <div class="body">${spot.student_perk}</div>
      </div>`;
  }

  let paymentsHtml = '';
  if (spot.payments && spot.payments.length) {
    paymentsHtml = `<dt>Betaling</dt><dd>${spot.payments.join(', ')}</dd>`;
  }

  root.innerHTML = `
    <div class="hero" style="background:${spot.color}">
      <div class="hero-inner">
        <div class="crumb">${spot.cats.join(' · ')}</div>
        <h1>${spot.name}</h1>
        <div class="meta-row">
          ${tags}${priceTag}
          <span class="badge">${spot.walk} min wandelen${spot.bike ? ` · ${spot.bike} min fietsen` : ''}${spot.transit ? ` · ${spot.transit} min OV` : ''}</span>
          ${favBadge}
        </div>
      </div>
    </div>

    <div class="wrap">
      <main>
        <p class="lede">${spot.long || spot.desc}</p>
        ${whyHtml}
        ${menuHtml}
        ${facilitiesHtml}
        ${tipHtml}
      </main>

      <aside class="side">
        <div class="info-card">
          <span class="open-now-pill"><span class="led"></span>Nu open</span>
          <h3>Praktisch</h3>
          <dl class="kv">
            <dt>Adres</dt><dd>${spot.address || '—'}</dd>
            ${spot.phone ? `<dt>Telefoon</dt><dd><a href="tel:${spot.phone.replace(/\\s/g,'')}">${spot.phone}</a></dd>` : ''}
            <dt>Vanaf campus</dt><dd>${spot.walk} min wandelen${spot.bike ? `, ${spot.bike} min fietsen` : ''}${spot.transit ? `, ${spot.transit} min OV` : ''}</dd>
            ${paymentsHtml}
          </dl>
        </div>

        ${hoursHtml ? `
        <div class="info-card">
          <h3>Openingsuren</h3>
          ${hoursHtml}
        </div>` : ''}

        ${perkHtml}

        <a class="cta" href="${routeUrl}" target="_blank" rel="noopener">Route via Google Maps →</a>
        <a class="cta secondary" href="KaaiSpots.html">← Terug naar de kaart</a>
      </aside>
    </div>`;
})();
</script>
</body>
</html>
